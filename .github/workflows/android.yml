name: Android app

# Builds the Android tablet/phone client (apps/android,
# docs/adr/0012-android-client.md): JVM unit tests, Android lint, the APK,
# and a smoke test in an Android emulator against a real Hub. With the
# signing secrets set (apps/android/README.md) the release APK is signed with
# your key, so updates install over the old app; otherwise use the debug APK.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      ['apps/android/**', 'apps/web/src/lib/android-bridge.ts', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and the debug APK
        working-directory: apps/android
        env:
          RESTRO_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug

      - name: Release APK
        working-directory: apps/android
        env:
          RESTRO_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RESTRO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RESTRO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RESTRO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export RESTRO_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/RestroOS-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/RestroOS.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/RestroOS-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Show lint findings
        if: failure()
        run: cat apps/android/app/build/intermediates/lint_intermediate_text_report/debug/*/lint-results-debug.txt || true

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: apps/android/app/build/reports/
          if-no-files-found: ignore

      # A real Hub on this runner, and the app in an emulator pointed at it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build and start a Hub
        run: |
          pnpm install --frozen-lockfile --filter '@restroos/server...' --filter '@restroos/web...'
          pnpm --filter @restroos/web build
          pnpm --filter @restroos/server build
          E2E_PORT=7400 RESTRO_LOG_LEVEL=info nohup node e2e/start-hub.mjs > "$RUNNER_TEMP/hub.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7400/api/v1/health; then exit 0; fi
            sleep 2
          done
          tail -40 "$RUNNER_TEMP/hub.log"
          exit 1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: apps/android/scripts/smoke-test.sh out/RestroOS-debug.apk "$RUNNER_TEMP/hub.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restroos-android
          path: |
            out/*.apk
            screenshots/
          if-no-files-found: warn
